[project]
name = "qwn"
version = "0.7.0"
description = "Local multimodal RAG and voice assistant using Qwen models on Apple Silicon with MLX"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Daryl Lim", email = "73304404+darylalim@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.33.0",
    "mlx-audio>=0.5.2",
    "mlx-lm>=0.32.0",
    "mlx-vlm>=0.7.4",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pypdfium2>=5.14",
    "sqlite-vec>=0.1.9",
    "streamlit>=1.65",
    "typer>=0.27",
]

[project.scripts]
qwn = "qwn.cli:app"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.uv]
required-version = ">=0.12.22,<0.13"   # CI and your machine use the same uv
python-preference = "only-managed"     # sqlite-vec needs SQLite extension loading; python.org builds lack it

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]  # PLAN.md/README.md code blocks are illustrative, not source

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: loads real MLX models (deselect with -m 'not slow')"]
